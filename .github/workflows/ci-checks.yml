name: CI (Type Check, Lint, Format, Audit, Build)

# Runs on non-draft PRs only (not on merge to main — merge already requires
# green checks). Draft PRs skip all jobs (saves Actions minutes); converting
# to ready re-runs.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit --pretty

  lint:
    name: Lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  format:
    name: Format
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${{ github.sha }}"
          base_sha="${{ github.event.pull_request.base.sha }}"

          if [[ -z "${base_sha}" ]]; then
            echo "No base SHA available; skipping Prettier check."
            exit 0
          fi

          # Only check files that are likely to need formatting.
          # (We intentionally exclude YAML/Kubernetes/Workflow files to avoid noisy failures.)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${base_sha}" "${head_sha}" \
            | grep -E '\.(ts|tsx|js|jsx|json|css|md|html)$' || true)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No relevant files changed; skipping Prettier check."
            exit 0
          fi

          echo "Running Prettier on changed files: ${#files[@]}"
          npx prettier@3.6.2 --check "${files[@]}"

  audit:
    name: Audit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
